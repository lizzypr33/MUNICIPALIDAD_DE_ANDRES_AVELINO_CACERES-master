spring.application.name=MUNICIPALIDAD_DE_ANDRES_AVELINO_CACERES

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/muni?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate: nunca create ni create-drop
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Flyway administra el esquema; Hibernate solo valida
spring.flyway.enabled=true

# No exponer detalles internos en errores
server.error.include-message=never
server.error.include-stacktrace=never

# Sesiones HTTP (PROMPT 03)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Poner SESSION_COOKIE_SECURE=true en producción (HTTPS); en desarrollo local se usa HTTP.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Paginación: nunca devolver listas ilimitadas
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Primer administrador (se crea automáticamente en el primer arranque)
app.bootstrap.admin.enabled=${ADMIN_BOOTSTRAP_ENABLED:true}
app.bootstrap.admin.username=${ADMIN_USERNAME:admin.municipal}
app.bootstrap.admin.email=${ADMIN_EMAIL:admin@municaceres.gob.pe}
app.bootstrap.admin.password=${ADMIN_PASSWORD:Admin2026!Municipal}

# Usuarios por defecto de cada rol (se crean al arrancar si no existen). Desactivar en producción.
app.bootstrap.default-users.enabled=${DEFAULT_USERS_ENABLED:true}
app.bootstrap.funcionario.username=${FUNCIONARIO_USERNAME:funcionario.municipal}
app.bootstrap.supervisor.password=${SUPERVISOR_PASSWORD:Supervisor2026!Muni}
app.bootstrap.funcionario.email=${FUNCIONARIO_EMAIL:funcionario@municaceres.gob.pe}
app.bootstrap.funcionario.password=${FUNCIONARIO_PASSWORD:Funcionario2026!Muni}
app.bootstrap.supervisor.username=${SUPERVISOR_USERNAME:supervisor.municipal}
app.bootstrap.supervisor.email=${SUPERVISOR_EMAIL:supervisor@municaceres.gob.pe}
app.bootstrap.ciudadano.username=${CIUDADANO_USERNAME:ciudadano.demo}
app.bootstrap.ciudadano.email=${CIUDADANO_EMAIL:ciudadano@municaceres.gob.pe}
app.bootstrap.ciudadano.password=${CIUDADANO_PASSWORD:Ciudadano2026!Demo}

# Almacenamiento de documentos adjuntos (PROMPT 05)
app.storage.documentos-path=${DOCUMENT_STORAGE_PATH:./data/documentos}
app.storage.max-file-size-bytes=${DOCUMENT_MAX_SIZE_BYTES:10485760}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Verificación pública de licencias por código QR (PROMPT 06)
app.licencias.verificacion-base-url=${LICENCIA_VERIFICACION_BASE_URL:http://localhost:8080}

# Límite máximo de registros exportables en reportes PDF/CSV y actividad reciente (PROMPT 08)
app.reportes.max-export-rows=${REPORTES_MAX_EXPORT_ROWS:1000}
app.dashboard.actividad-reciente.max-limit=${DASHBOARD_ACTIVIDAD_MAX_LIMIT:100}