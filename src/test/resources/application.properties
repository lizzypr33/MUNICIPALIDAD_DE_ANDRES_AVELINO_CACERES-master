spring.application.name=MUNICIPALIDAD_DE_ANDRES_AVELINO_CACERES

# Este archivo REEMPLAZA a application.properties principal durante las pruebas,
# por eso repite las propiedades de JPA, errores y paginación.

# Base de pruebas SEPARADA de la de desarrollo (nunca apuntar a muni).
# La contraseña viene de la variable de entorno DB_PASSWORD.
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/muni_test?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true

server.error.include-message=never
server.error.include-stacktrace=never

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# El bootstrap nunca se ejecuta en pruebas
app.bootstrap.admin.enabled=false
app.bootstrap.default-users.enabled=false

# Almacenamiento de documentos en pruebas
app.storage.documentos-path=${DOCUMENT_STORAGE_PATH:./target/test-documentos}
app.storage.max-file-size-bytes=${DOCUMENT_MAX_SIZE_BYTES:10485760}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Verificación pública de licencias por código QR (PROMPT 06)
app.licencias.verificacion-base-url=${LICENCIA_VERIFICACION_BASE_URL:http://localhost:8080}

# Propiedades requeridas por DefaultUsersBootstrap (desactivado en pruebas)
app.bootstrap.funcionario.username=funcionario.test
app.bootstrap.funcionario.email=funcionario@test.local
app.bootstrap.funcionario.password=Funcionario2026!Test
app.bootstrap.supervisor.username=supervisor.test
app.bootstrap.supervisor.email=supervisor@test.local
app.bootstrap.supervisor.password=Supervisor2026!Test
app.bootstrap.ciudadano.username=ciudadano.test
app.bootstrap.ciudadano.email=ciudadano@test.local
app.bootstrap.ciudadano.password=Ciudadano2026!Test
